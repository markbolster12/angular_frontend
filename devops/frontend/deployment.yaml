# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goal-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goal-frontend
  template:
    metadata:
      labels:
        app: goal-frontend
    spec:
      containers:
        - name: goal-frontend
          image: goalsfrontend:latest
          # k8s defaults :latest to Always, which tries to pull from a registry and fails
          # (ImagePullBackOff) unless this image is actually pushed somewhere. IfNotPresent
          # uses whatever's already loaded on the node instead. Switch back to Always (or
          # drop this) once you're pulling from a real registry with a real version tag.
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            # Must match the backend's actual Service name/port. Resolved once at container
            # startup via the normal k8s Service DNS path — same as `curl goalsapp:8080`
            # from a shell in this pod.
            - name: BACKEND_HOST
              value: goalsapp
            - name: BACKEND_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: goal-frontend
spec:
  # NodePort needs no ingress controller or cloud load-balancer — reach it at
  # http://<any-node-ip>:<nodePort> (find nodePort with `kubectl get svc goal-frontend`).
  # Swap to LoadBalancer or add an Ingress if your cluster has one set up.
  type: NodePort
  selector:
    app: goal-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30002
