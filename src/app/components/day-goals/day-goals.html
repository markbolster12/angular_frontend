@for (goal of todaysGoals(); track goal.id) {
  <app-goal-component [goal]="goal"></app-goal-component>
} @empty {
  <p>No goals found!</p>
}

@if (showCreate) {
  <app-goal-form (formSubmit)="onGoalCreated()"></app-goal-form>
}
<button (click)="toggleCreate()">{{showCreate?"Cancel":"Add Goal"}}</button>
