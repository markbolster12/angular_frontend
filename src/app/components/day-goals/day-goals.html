<div class="goal-list__filter">
  <button class="goal-list__filter-nav" (click)="previousWeek()" aria-label="Previous week">‹</button>
  <span class="goal-list__filter-label">{{ rangeLabel() }}</span>
  <button class="goal-list__filter-nav" (click)="nextWeek()" aria-label="Next week">›</button>
  <button class="goal-list__filter-reset" (click)="resetToThisWeek()">This Week</button>
</div>

<div class="goal-list__days">
  @for (day of weekDays(); track day.date.getTime(); let i = $index) {
    <button
      type="button"
      class="goal-list__day"
      [class.goal-list__day--active]="selectedWeekday() === i"
      (click)="selectWeekday(i)"
    >
      <span class="goal-list__day-label">{{ day.label }}</span>
      <span class="goal-list__day-number">{{ day.dayOfMonth }}</span>
    </button>
  }
</div>

<div class="goal-list">
  @for (goal of visibleGoals(); track goal.id) {
    <app-goal-component [goal]="goal" [hideStartDate]="selectedWeekday() !== null"></app-goal-component>
  } @empty {
    <p class="goal-list__empty">No goals found!</p>
  }
</div>

@if (showCreate) {
  <app-goal-form (formSubmit)="onGoalCreated()"></app-goal-form>
}
<button class="goal-list__add-btn" (click)="toggleCreate()">{{showCreate?"Cancel":"Add Goal"}}</button>
